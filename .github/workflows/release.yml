# A release of the desktop app.
#
# A tag v<version> pushed (v0.2.0, or v0.2.0-beta.1 for a pre-release): the checks, the app packaged for Windows (an
# installer and a zip, the version the tag's), and a GitHub release of that tag with them and notes from its changes.
# Run by hand (Actions, Release, Run workflow): the checks and the package only, kept as the run's artifact.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  check:
    name: Checks
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install the packages
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  package:
    name: Package for Windows
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install the packages
        run: npm ci

      - name: The version from the tag
        if: github.ref_type == 'tag'
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: top-race-editor-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub release
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: top-race-editor-windows
          path: release

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # (the workflow run again: the files replaced)
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            pre=()
            if [[ "$TAG" == *-* ]]; then pre=(--prerelease); fi
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes \
              --verify-tag "${pre[@]}"
          fi
