sonar.projectKey=top-race-editor
sonar.projectName=Top Race editor
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# The editor (TypeScript, React) and its engine (TypeScript, src/engine)
sonar.sources=src
sonar.tests=src
sonar.exclusions=src/test/**,src/**/*.test.ts,src/**/*.test.tsx
sonar.test.exclusions=src/test/legacy/**
sonar.test.inclusions=src/test/**,src/**/*.test.ts,src/**/*.test.tsx

# Coverage: `npm run test:coverage` (scripts/sonar-reports.mjs makes its paths the scanner's)
sonar.javascript.lcov.reportPaths=coverage/web/lcov.info
sonar.coverage.exclusions=src/main.tsx
