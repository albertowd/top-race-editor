# SonarQube for this project, on Docker.
#   npm run sonar:up      start SonarQube (http://localhost:9000; first login admin / admin)
#   npm run sonar         tests with coverage, then a scan (needs SONAR_TOKEN, see README)
#   npm run sonar:down    stop it (its data kept in the volumes)
name: top-race-editor

services:
  sonarqube:
    image: ${SONARQUBE_IMAGE:-sonarqube:26.7.0.124771-community}
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", 'curl -fs http://localhost:9000/api/system/status | grep -q ''"status":"UP"''']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  scanner:
    image: ${SONAR_SCANNER_IMAGE:-sonarsource/sonar-scanner-cli:latest}
    profiles: ["scan"]
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - .:/usr/src
    working_dir: /usr/src

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
